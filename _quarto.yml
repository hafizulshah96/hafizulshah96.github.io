project:
  type: website
  output-dir: _site

website:
  title: "MHS"
  site-url: "https://hafizulshah96.github.io"
  description: "Personal website, technical articles, and notes on Computational Physics, Data Science, and AI."
  navbar:
    right:
      - text: "Home"
        href: index.qmd
      - text: "Articles"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/hafizulshah96
      - icon: linkedin
        href: https://www.linkedin.com

format:
  html:
    theme:
      light: [cosmo, custom-light.scss]
      dark: [darkly, custom-dark.scss]
    css: styles.css
    toc: true
    code-fold: show
    code-tools: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
